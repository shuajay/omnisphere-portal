<div class="topbar">
    <div class="logo-container">
        <h1>Omnisphere Portal</h1>
    </div>
    <nav>
        <div class="topbar-content">

    <button
      type="button"
      title="Help"
      aria-label="View help"
      class="btn btn-icon btn-md"
    >
      <fa-icon [icon]="faCircleQuestion"></fa-icon>
    </button>

    <button
      type="button"
      class="btn btn-icon btn-md"
      title="Notifications"
      aria-label="View notifications"
    >
      <fa-icon [icon]="faBell"></fa-icon>
    </button>

    <button 
      type="button" 
      (click)="toggleTheme()" 
      [title]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'" 
      [attr.aria-label]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
      class="btn btn-icon btn-md"
    >
      <fa-icon [icon]="isDarkTheme ? faSun : faMoon"></fa-icon>
    </button>

    <div class="dropdown">
      <button
      type="button"
      class="btn btn-icon btn-md"
      title="User"
      aria-label="User"
      >
        <fa-icon [icon]="faCircleUser"></fa-icon>
      </button>
      <div class="dropdown-content">
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#" (click)="logout()">Logout</a>
      </div>
    </div>
    

    <!-- <button 
      type="button" 
      (click)="logout()"
      class="btn btn-secondary"
      >
      Logout
    </button> -->
  </div>
    </nav>
</div>
