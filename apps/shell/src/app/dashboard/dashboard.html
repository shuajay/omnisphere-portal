<div class="dashboard-container">
  <!-- Row 1: Chart + Stats Grid -->
   <div class="top-section">

    <div class="data-card chart-card">

      <div class="card-header">
        <h3>Data Charts</h3>
        <button class="more-btn">...</button>
      </div>
      <div class="bar-chart-placeholder">
        <!-- bar chart will be rendered here -->
      </div>

    </div>

    <div class="stats-grid">

      <div class="data-card stat-card">
        <span class="stat-label">Active Users</span>
        <span class="stat-value">1,234</span>
      </div>
      <div class="data-card stat-card">
        <span class="stat-label">Total Projects</span>
        <span class="stat-value">776</span>
      </div>
      <div class="data-card stat-card">
        <span class="stat-label">Total Payments</span>
        <span class="stat-value">$2,222</span>
        <span class="stat-change positive">▲ 53.07%</span>
      </div>
      <div class="data-card stat-card">
        <span class="stat-label">Total Change</span>
        <span class="stat-value">103</span>
        <div class="mini-line-chart-placeholder"></div>
      </div>

    </div>

   </div>


  <!-- Row 2: Wide stats banner + Quick Access -->
   <div class="middle-section">
    <div class="data-card wide-stats-card">
      
      <div class="stat-item">
        <span class="stat-label">Total Users</span>
        <span class="stat-value">3,234</span>
      </div>
      
      <div class="divider"></div>
      
      <div class="stat-item">
        <span class="stat-label">Active Users</span>
        <span class="stat-value">1,234</span>
      </div>
    
      <div class="divider"></div>
    
      <div class="stat-item">
        <span class="stat-label">Total Projects</span>
        <span class="stat-value">776</span>
      </div>

    </div>
    
    <div class="data-card quick-access-card">
      <div class="card-header">
        <h3>Quick Access</h3>
        <button class="more-btn">...</button>
      </div>

      <ul class="quick-access-list">
        
        <li class="quick-access-item">
          <span class="qa-icon">
            <fa-icon [icon]="faTachographDigital"></fa-icon>
          </span>
          <span> Dashboard</span>
        </li>
        
        <li class="quick-access-item">
          <span class="qa-icon">
            <fa-icon [icon]="faUser"></fa-icon>
          </span>
          <span> Tenmark Project</span>
        </li>
        
        <li class="quick-access-item">
          <span class="qa-icon">
            <fa-icon [icon]="faMedal"></fa-icon>
          </span>
          <span> Man in Map</span> 
        </li>
      </ul>
    </div>
   </div>

  <!-- Row 3: Percent data area chart -->
  <div class="data-card percent-data-card">
    <div class="card-header">
      <h3>Percent data</h3>
      <div class="legend">
        <span class="legend-item new">● New</span>
        <span class="legend-item tieg">● Tieg ▾</span>
      </div>
    </div>
    <div class="area-chart-placeholder">
      <!-- area chart goes here -->
    </div>
  </div>

</div>
